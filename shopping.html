<!DOCTYPE html>
<html>
    <head>
        
        <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
        <link rel="stylesheet" href="style.css">

        <link rel="manifest" href="manifest.json" />
        <link rel="icon" type="image/x-icon" href="/icons/favicon.png">

        <script type="importmap">
            {
                "imports": {
                "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
                }
            }
        </script>
    </head>

    <body>


        <div id="app">

            <div id="tabSelect">
                    <button @click="settings.openTab = 'products'" :class="{selected:settings.openTab=='products' || settings.openTab==''}">Products</button>
                    <button @click="settings.openTab = 'recipes'" :class="{selected:settings.openTab=='recipes'}">Recipes</button>
                    <button @click="settings.openTab = 'stores'" :class="{selected:settings.openTab=='stores'}">Stores</button>
                    <button @click="settings.openTab = 'shopping'" :class="{selected:settings.openTab=='shopping'}">Shopping</button>
                    <button @click="settings.openTab = 'settings'" :class="{selected:settings.openTab=='settings'}">Settings</button>
            </div>
            <div class="desktopcont">
                <div id="products" class="container" :class="{selected:settings.openTab=='products' || settings.openTab==''}">
                    <div class="grid-header">
                        <div class="item">Sort by
                            <select id="selectSort" class="sortSelect" v-model="settings.selectedSort">
                                <option v-for="(sort, sortkey) in productSortList" :value="sortkey">{{sortkey}}</option>
                            </select>

                        </div>
                        <div class="item"><span class="material-symbols-outlined">delete</span></div>
                        <div class="item">
                            <select id="selectStore" v-model="productStore">
                                <option value="-1">Select A Store</option>
                                <option v-for="(store, storekey) in stores" :value="storekey">{{store.name}}</option>
                            </select>
                        </div>
                        <div class="item"><span class="material-symbols-outlined">autorenew</span></div>
                        <div class="item"><span class="material-symbols-outlined">list_alt</span></div>
                    </div>


                    <template v-for="(prodkey, prodkeyindex) in productSortList[settings.selectedSort]">
                        <div class="item"><input :tabindex="prodkeyindex+1" @change="removeDuplicateProduct(prodkey)" :id="'product_'+prodkey" type="text" v-model.lazy="products[prodkey].name" /></div>
                        <div class="item"><span @click="deleteProduct(prodkey)" class="material-symbols-outlined">delete</span></div>                        
                        <div class="item">
                            <select :id="'prodStoreSelect_'+prodkey" v-if="productStore > -1" v-model="products[prodkey].aisles[productStore]" :key="prodkey">
                                <option value="-1"></option>
                                <option v-for="(aisle,aislekey) in stores[productStore].aisles" :value="aislekey">{{aisle.name}}</option>
                            </select>
                        </div>


                        <div v-if="!products[prodkey].weekly" class="item"><button @click="products[prodkey].weekly = true" class="material-symbols-outlined">check_box_outline_blank</button></div>
                        <div v-if="products[prodkey].weekly" class="item"><span @click="products[prodkey].weekly = false" class="material-symbols-outlined">check_box</span></div>
                        
                        <div v-if="!products[prodkey].onlist" class="item"><span @click="products[prodkey].onlist = true" class="material-symbols-outlined">check_box_outline_blank</span></div>
                        <div v-if="products[prodkey].onlist" class="item"><span @click="products[prodkey].onlist = false" class="material-symbols-outlined">check_box</span></div>


                    </template>

                    <div class="item"><input :tabindex="productSortList[settings.selectedSort].length+1" id="newProduct" v-on:focus="addProduct()" type="text" value="" placeholder="New Product..." /></div>
                    <div class="item"></div>
                    <div class="item"></div>
                    <div class="item"></div>
                    <div class="item"></div>

                </div>

                <div id="recipes" class="container" :class="{selected:settings.openTab=='recipes'}">
                    <div class="grid-header">
                        <div class="item"><span class="material-symbols-outlined">add</span></div>
                        <div class="item span2">Recipe</div>
                        <div class="item"><span class="material-symbols-outlined">list_alt</span></div>
                        <div class="item"><span class="material-symbols-outlined">delete</span></div>
                    </div>

                        <template v-for="(recipe,reckey) in recipes">
                            <div v-if="!recipe.expand" class="item"><span @click="recipe.expand = true" class="material-symbols-outlined">add</span></div>
                            <div v-if="recipe.expand" class="item"><span @click="recipe.expand = false" class="material-symbols-outlined">remove</span></div>
                            <div class="item span2"><input :id="'recipe_'+reckey" type="text" v-model="recipe.name" /></div>

                            <div v-if="!recipesOnList[reckey].all && recipesOnList[reckey].none" class="item"><button @click="recipeOnList(reckey, true)" class="material-symbols-outlined">check_box_outline_blank</button></div>
                            <div v-if="!recipesOnList[reckey].all && !recipesOnList[reckey].none" class="item"><button @click="recipeOnList(reckey, true)" class="material-symbols-outlined">indeterminate_check_box</button></div>
                            <div v-if="recipesOnList[reckey].all && !recipesOnList[reckey].none" class="item"><button @click="recipeOnList(reckey, false)" class="material-symbols-outlined">check_box</button></div>



                            <div class="item"><span @click="deleteRecipe(reckey)" class="material-symbols-outlined">delete</span></div> 
                        
                            <template v-if="recipe.expand">
                                
                                <div class="ingredients">
                                    <template v-for="(product,recprodkey) in recipe.products">
                                        <div class="item"></div>
                                        <div class="item"><input @change="addRecipeProduct(reckey, $event,recprodkey)" list="product-suggestions" :id="'product_'+reckey+'_'+recprodkey" type="text" :value="products[product.prodkey].name" /></div>
                                        <div v-if="!product.onlist" class="item"><button @click="toggleRecipeProduct(reckey,recprodkey)" class="material-symbols-outlined">check_box_outline_blank</button></div>
                                        <div v-if="product.onlist" class="item"><button @click="toggleRecipeProduct(reckey,recprodkey)" class="material-symbols-outlined">check_box</button></div>
                                        <div class="item"><button @click="deleteRecipeProduct(reckey, recprodkey)" class="material-symbols-outlined">delete</button></div>
                                    </template>
                                    
                                    <div class="item"></div>
                                    <div class="item"><input list="product-suggestions" :id="'recipe_new_product_'+reckey" v-on:change="addRecipeProduct(reckey, $event)" type="text" value="" placeholder="Add Product To Recipe..." /></div>
                                    <div class="item"></div>
                                    <div class="item"></div>
                                </div>
                            </template>
                            
                        
                        </template>

                        <div class="item"></div>
                        <div class="item span2"><input id="newRecipe" v-on:focus="newRecipe()" type="text" value="" placeholder="New Recipe..." /></div>
                        <div class="item"></div>
                        <div class="item"></div> 


                </div>
                
                <div id="stores" class="container" :class="{selected:settings.openTab=='stores'}">
                    <div class="grid-header">
                        <div class="item"><span class="material-symbols-outlined">add</span></div>
                        <div class="item span2">Name</div>
                        <div class="item"></div>
                        <div class="item"></div>
                        <div class="item"><span class="material-symbols-outlined">list_alt</span></div>

                        <div class="item"><span class="material-symbols-outlined">delete</span></div>

                    </div>
                    <template v-for="storekey in this.storesOrder">
                        <div v-if="!stores[storekey].expand" class="item"><span @click="expandStore(storekey)" class="material-symbols-outlined">add</span></div>
                        <div v-if="stores[storekey].expand" class="item"><span @click="collapseStore(storekey)" class="material-symbols-outlined">remove</span></div>
                        <div class="item span2"><input :id="'store_'+storekey" type="text" v-model="stores[storekey].name" /></div>
                        <div class="item"><span @click="moveStore(storekey, -1)" class="material-symbols-outlined">arrow_circle_up</span></div>
                        <div class="item"><span @click="moveStore(storekey, 1)" class="material-symbols-outlined">arrow_circle_down</span></div>
                        <div v-if="!stores[storekey].onlist" class="item"><span @click="stores[storekey].onlist = true" class="material-symbols-outlined">check_box_outline_blank</span></div>
                        <div v-if="stores[storekey].onlist" class="item"><span @click="stores[storekey].onlist = false" class="material-symbols-outlined">check_box</span></div>
                        <div class="item"><span @click="deleteStore(storekey)" class="material-symbols-outlined">delete</span></div>

                        <template v-if="stores[storekey].expand">
                            <!--
                            <div class="item"></div>
                            <div class="item">Aisle Name</div>
                            <div class="item span2">Order</div>
                            <div class="item"></div>
                            <div class="item"><span class="material-symbols-outlined">delete</span></div>
                            -->
                            <div class="aisles">

                                <template v-for="aislekey in stores[storekey].aislesOrder">
                                    <div class="item"></div>
                                    <div class="item"><input :id="'aisle_'+storekey+'_'+aislekey" type="text" v-model="stores[storekey].aisles[aislekey].name" /></div>
                                    <div class="item"><span @click="moveAisle(storekey, aislekey, -1)" class="material-symbols-outlined">arrow_circle_up</span></div>
                                    <div class="item"><span @click="moveAisle(storekey, aislekey, 1)" class="material-symbols-outlined">arrow_circle_down</span></div>
                                    <div class="item"></div>
                                    <div class="item"><span @click="deleteAisle(storekey, aislekey)" class="material-symbols-outlined">delete</span></div>
                                </template>
                                <div class="item"></div>
                                <div class="item"><input :id="'newAisle_'+storekey" v-on:focus="newAisle(storekey)" type="text" value="" placeholder="New Aisle..." /></div>
                                <div class="item"></div>
                                <div class="item"></div>
                                <div class="item"></div>
                                <div class="item"></div>

                            </div>
                            


                        </template>



                    </template>

                    <div class="item"></div>
                    <div class="item span2"><input id="newStore" v-on:focus="newStore" type="text" value="" placeholder="New Store..." /></div>
                    <div class="item"></div>
                    <div class="item"></div>   
                    <div class="item"></div>
                    <div class="item"></div>
                    
             
                </div>

                <div id="shopping" class="container" :class="{selected:settings.openTab=='shopping'}">

                    <div class="grid-header">
                        <div class="item">Product</div>
                        <div class="item"></div>
                        <div class="item"><span class="material-symbols-outlined">delete</span></div>
                        <div class="item">Location</div>
                        <div class="item"><span class="material-symbols-outlined">shopping_cart</span></div>
                    </div>
                    <!-- Items with no location -->
                    <template v-for="shopitem in shoppingList['-1']['-1']">

                        <div class="fullwidth"></div>
                        <div class="item">{{products[shopitem.prodkey].name}}</div>
                        <div class="item">
                            <span v-if="shopitem.recKey >= 0" class="material-symbols-outlined">chef_hat</span>
                            <span v-else-if="shopitem.weekly" class="material-symbols-outlined">autorenew</span>
                        </div>
                        <div class="item">
                            <span v-if="shopitem.recKey >= 0" @click="recipes[shopitem.recKey].products[shopitem.recprodkey].onlist=false" class="material-symbols-outlined">delete</span>
                            <span v-else @click="products[shopitem.prodkey].onlist=false" class="material-symbols-outlined">delete</span>
                        </div>
                        <div class="item"></div>
                        <div class="item">
                            <template v-if="shopitem.recKey >= 0">
                                <span v-if="recipes[shopitem.recKey].products[shopitem.recprodkey].bought" @click="recipes[shopitem.recKey].products[shopitem.recprodkey].bought=false" class="material-symbols-outlined">check_box</span>
                                <span v-else @click="recipes[shopitem.recKey].products[shopitem.recprodkey].bought=true" class="material-symbols-outlined">check_box_outline_blank</span>
                            </template>
                            <template v-else>
                                <span v-if="products[shopitem.prodkey].bought" @click="products[shopitem.prodkey].bought=false" class="material-symbols-outlined">check_box</span>
                                <span v-else @click="products[shopitem.prodkey].bought=true" class="material-symbols-outlined">check_box_outline_blank</span>
                            </template>
                            
                        </div>


                    </template>

                    <!-- Items with location -->
                    <template v-for="storekey in this.storesOrderOnList">
                        <template v-for="aislekey in stores[storekey].aislesOrder">
                            <template v-for="shopitem in shoppingList[storekey][aislekey]">

                                <div class="fullwidth"></div>
                                <div class="item">{{products[shopitem.prodkey].name}}</div>
                                <div class="item">
                                    <span v-if="shopitem.recKey >= 0" class="material-symbols-outlined">chef_hat</span>
                                    <span v-else-if="shopitem.weekly" class="material-symbols-outlined">autorenew</span>
                                </div>
                                <div class="item">
                                    <span v-if="shopitem.recKey >= 0" @click="recipes[shopitem.recKey].products[shopitem.recprodkey].onlist=false" class="material-symbols-outlined">delete</span>
                                    <span v-else @click="products[shopitem.prodkey].onlist=false" class="material-symbols-outlined">delete</span>
                                </div>
                                <div class="item">{{stores[storekey].name+", "+stores[storekey].aisles[aislekey].name}}</div>
                                <div class="item">
                                    <template v-if="shopitem.recKey >= 0">
                                        <span v-if="recipes[shopitem.recKey].products[shopitem.recprodkey].bought" @click="recipes[shopitem.recKey].products[shopitem.prodkey].bought=false" class="material-symbols-outlined">check_box</span>
                                        <span v-else @click="recipes[shopitem.recKey].products[shopitem.recprodkey].bought=true" class="material-symbols-outlined">check_box_outline_blank</span>
                                    </template>
                                    <template v-else>
                                        <span v-if="products[shopitem.prodkey].bought" @click="products[shopitem.prodkey].bought=false" class="material-symbols-outlined">check_box</span>
                                        <span v-else @click="products[shopitem.prodkey].bought=true" class="material-symbols-outlined">check_box_outline_blank</span>
                                    </template>
                                    
                                </div>


                            </template>
                        </template>
                    </template>


                </div>


                <div id="settings" class="container" :class="{selected:settings.openTab=='settings'}">
                    <div>
                        Paste your shopping list below and click <button @click="importShoppingList()">here</button>
                        <textarea id="listImportText" v-model="listimport"></textarea>
                    </div>
                    
                    <hr>
                    <div><a download="shoppinglistbackup.json" :href="backupURL">Download Shopping List Backup</a></div>
                    <hr>
                    <div>
                        <input id="loadBackupFile" ref="backupupload" @change="uploadBackup($event)" type="file" /><button @click="loadDataFromBackup" :disabled="uploadedBackup == ''">Restore Uploaded Backup</button>
                    </div>
                    <div>
                        New products are automatically added to the shopping list: <input type="checkbox" id="newProdOnList" v-model="settings.newProdOnList" />
                    </div>
                </div>
            </div>

            

            <datalist id="product-suggestions">
                    <option v-for="(prodname,prodkey) in autofillList" >{{prodname}}</option>
            </datalist>

        </div>

        <script type="module">
            import { createApp } from 'vue'
            import App from './app.js'

            createApp(App).mount('#app')
        </script>

        
        <!-- Register the app's service worker. -->
        <script>
        if (location.hostname != "127.0.0.1") {
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("worker.js");
            }
        }

        </script>
        
    </body>

</html>
